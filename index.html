<title>NJ-06 Grid Cost Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="app-style">
/* Layout: a utility-bill ledger. Key numbers, lanes by level of government, two charts from grid to bill, then a dated record with analysis. */
:root{
  --bg:#ECEFF3; --surface:#FAFBFC; --ink:#152033; --muted:#566175; --line:#C9D0DB; --grid:#DDE2EA;
  --accent:#1F4E8C; --accent-soft:#DCE6F3;
  --amber:#A8501A; --amber-soft:#F4E1D3;
  --ok:#2F6B40; --ok-soft:#DCEBDF; --info:#5A3F8C; --info-soft:#E7E0F2; --grey-soft:#E1E5EC;
  --c-jcpl:#1F4E8C; --c-pseg:#7FA3CF; --c-cap:#A8501A; --c-nj:#1F4E8C; --c-us:#9AA3B2;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141C; --surface:#161D28; --ink:#E4E9F1; --muted:#9AA6B8; --line:#2B3545; --grid:#232C3A;
    --accent:#8DB4EA; --accent-soft:#1B2A40; --amber:#E89A62; --amber-soft:#3A2518;
    --ok:#8CCB9C; --ok-soft:#1B3024; --info:#C3AEEB; --info-soft:#2A2340; --grey-soft:#232B38;
    --c-jcpl:#8DB4EA; --c-pseg:#4A6D99; --c-cap:#E89A62; --c-nj:#8DB4EA; --c-us:#5E6878;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#161D28; --ink:#E4E9F1; --muted:#9AA6B8; --line:#2B3545; --grid:#232C3A;
  --accent:#8DB4EA; --accent-soft:#1B2A40; --amber:#E89A62; --amber-soft:#3A2518;
  --ok:#8CCB9C; --ok-soft:#1B3024; --info:#C3AEEB; --info-soft:#2A2340; --grey-soft:#232B38;
  --c-jcpl:#8DB4EA; --c-pseg:#4A6D99; --c-cap:#E89A62; --c-nj:#8DB4EA; --c-us:#5E6878;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:32px 64px}
@media (max-width:480px){.wrap{padding-inline:16px;padding-block:20px 48px}}

.mast{display:grid;gap:16px;padding-bottom:24px;border-bottom:2px solid var(--ink)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
h1{font:700 clamp(30px,5vw,46px)/1.08 var(--serif);margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{max-width:66ch;margin:0;color:var(--muted);font-size:16px}
.byline{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.byline strong{color:var(--ink);font-weight:600}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:24px}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:4px;align-content:start;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer}
.stat:hover .v{color:var(--accent)}
.stat .k{font:500 11px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:700 24px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.ledger{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.ledger{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lane{background:var(--surface);border:1px solid var(--line);padding:12px 14px;display:grid;gap:8px;cursor:pointer;text-align:left;color:inherit;font:inherit;min-width:0}
.lane:hover{border-color:var(--accent)}
.lane[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lane .name{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.lane .name span{font:500 12px var(--mono);color:var(--muted)}
.lane .desc{font-size:12px;color:var(--muted);line-height:1.35}
.ticks{display:flex;flex-wrap:wrap;gap:3px;min-height:10px}
.tick{width:10px;height:10px;background:var(--accent)}
.lane .last{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.money{margin-top:36px;display:grid;gap:14px}
.money>h2{font:700 24px/1.2 var(--serif);margin:0}
.money>p{margin:0;color:var(--muted);max-width:70ch}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.chart{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:grid;gap:12px;align-content:start;min-width:0}
.chart h3{font:600 17px/1.3 var(--serif);margin:0}
.chart .sub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.sw.ghost{background:transparent;border:1.5px dashed var(--c-cap)}
.svgbox{width:100%;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;min-width:300px}
.svgbox text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.svgbox .val{fill:var(--ink);font-weight:500}
.svgbox .gl{stroke:var(--grid);stroke-width:1}
.svgbox .base{stroke:var(--line);stroke-width:1}
.svgbox .col{fill:var(--c-cap)}
.svgbox .ghost{fill:none;stroke:var(--c-cap);stroke-width:1.5;stroke-dasharray:4 3}
.svgbox .hit{fill:transparent;cursor:pointer}
.svgbox .hit:hover + .col,.svgbox g.colg:hover .col{filter:brightness(1.12)}
.bars{display:grid;gap:14px}
.bgroup{display:grid;gap:4px}
.bgroup .gl-label{font:500 12px var(--mono);color:var(--muted);letter-spacing:.03em}
.brow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.brow .who{font-size:12px;color:var(--muted)}
.track{display:block;position:relative;height:18px;padding-right:62px}
.track-inner{display:block;position:relative;height:100%}
.tgl{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--grid)}
.bar{position:absolute;left:0;top:1px;height:16px;border-radius:0 3px 3px 0}
.brow:hover .bar{filter:brightness(1.12)}
.bar-val{position:absolute;top:0;font:500 12px/18px var(--mono);color:var(--ink);white-space:nowrap;padding-left:6px;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}
.axis .ticks-x{position:relative;height:16px;margin-right:62px}
.axis .ticks-x span{position:absolute;transform:translateX(-50%);font:400 11px var(--mono);color:var(--muted);white-space:nowrap}
.axis .ticks-x span:first-child{transform:none}
details.tbl{font-size:13px}
details.tbl summary{cursor:pointer;color:var(--accent);font-weight:500}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tbl td.n{text-align:right}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:8px 10px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.18)}

.controls{margin-top:32px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls input,.controls select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 10px;min-width:0}
.controls input{flex:1 1 220px}
.controls select{flex:0 1 220px}
.count{font:500 12px var(--mono);color:var(--muted);margin-left:auto}
.btn{font:600 14px var(--sans);border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--amber);background:var(--amber);color:var(--surface)}
.btn.small{font-size:12px;padding:4px 10px}
.btn:disabled{opacity:.5;cursor:default}

.timeline{margin-top:20px;display:grid;gap:28px}
.month{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px}
@media (max-width:640px){.month{grid-template-columns:1fr;gap:8px}}
.mlabel{font:500 13px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:14px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start}
@media (max-width:640px){.mlabel{position:static;padding-top:0;border-bottom:1px solid var(--line);padding-bottom:6px}}
.entries{display:grid;gap:12px}
.entry{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:grid;gap:10px;min-width:0}
.entry.gulf{border-left:3px solid var(--amber)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.date{font:500 12px var(--mono);color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}
.chip{font:500 11px/1 var(--mono);letter-spacing:.04em;padding:5px 7px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.chip.scope{color:var(--ink)}
.pill{font:600 11px/1 var(--sans);padding:5px 8px;border-radius:999px}
.st-Announced,.st-Proposed,.st-Reported{background:var(--amber-soft);color:var(--amber)}
.st-Approved,.st-Signed,.st-Passed{background:var(--info-soft);color:var(--info)}
.st-Enacted,.st-Completed{background:var(--ok-soft);color:var(--ok)}
.st-Ongoing,.st-other{background:var(--grey-soft);color:var(--muted)}
.entry h3{font:600 19px/1.3 var(--serif);margin:0;text-wrap:balance}
.row{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
.value{font:500 13px var(--mono);color:var(--accent);white-space:nowrap}
.summary{margin:0;max-width:72ch}
.sources{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;display:grid;gap:4px}
.note .k{font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.note p{margin:0;white-space:pre-wrap}
.note.empty{background:transparent;border-left-color:var(--line)}
.note.empty p{color:var(--muted);font-style:italic}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty-state{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line)}

.editor{margin-top:20px;background:var(--surface);border:1px solid var(--accent);padding:18px;display:grid;gap:14px}
.editor h2{font:600 20px var(--serif);margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field label,.field legend{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:8px 10px;width:100%}
.field textarea{min-height:84px;resize:vertical}
fieldset.field{border:0;padding:0;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
.msg{font-size:13px;color:var(--amber)}

.natl{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:grid;gap:12px}
.natl h3{font:600 17px/1.3 var(--serif);margin:0}
.natl .sub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.nrows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:820px){.nrows{grid-template-columns:1fr}}
.nmetric{display:grid;gap:6px;min-width:0}
.nmetric .gl-label{font:500 12px var(--mono);color:var(--muted);letter-spacing:.03em}
.nmetric .srcl{font-size:12px;color:var(--muted)}
.about{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;font-size:13px;color:var(--muted)}
.about h4{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin:0 0 6px}
.about p{margin:0}
@media (max-width:720px){.about{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.entry{transition:border-color .15s}}
</style>

<script id="tracker-data" type="application/json">{"updated": "2026-10-19", "keyNumbers": [{"k": "PJM capacity price, 2028/29", "v": "$325/MW-day", "s": "At the price cap for a third straight auction", "entry": "d12"}, {"k": "JCP&L average bill", "v": "$137.47/mo", "s": "Up 22% from $112.25 before June 2025", "entry": "d08"}, {"k": "NJ towns banning data centers", "v": "93 of 564", "s": "Including Asbury Park and Neptune", "entry": "d18"}, {"k": "PJM reserve shortfall", "v": "6.8 GW", "s": "Below the reliability target for 2028/29", "entry": "d12"}], "capacity": [{"dy": "2025/26", "price": 269.92, "entry": "d01"}, {"dy": "2026/27", "price": 329.17, "entry": "d03"}, {"dy": "2027/28", "price": 333.44, "uncapped": 530, "entry": "d05"}, {"dy": "2028/29", "price": 325, "uncapped": 555, "entry": "d12"}], "bills": [{"period": "Before June 2025", "jcpl": 112.25, "pseg": 155.84, "entry": "d02"}, {"period": "From June 2025", "jcpl": 134.92, "pseg": 182.71, "entry": "d02"}, {"period": "From June 2026", "jcpl": 137.47, "pseg": 180.23, "entry": "d08"}], "entries": [{"id": "d01", "date": "2024-07-30", "scopes": ["PJM grid"], "category": "Capacity market", "status": "Completed", "title": "PJM capacity price hits a record $269.92/MW-day for 2025/26", "summary": "PJM, the grid operator for New Jersey and 12 other states, cleared its capacity auction for June 2025 to May 2026 at $269.92 per megawatt-day. The result fed directly into New Jersey's next power supply auction.", "value": "$269.92/MW-day", "sources": [{"label": "Utility Dive", "url": "https://www.utilitydive.com/news/pjm-interconnection-capacity-auction-prices/753798/"}, {"label": "WHYY", "url": "https://whyy.org/articles/new-jersey-electricity-utility-bill-increase-june/"}], "note": "Capacity payments keep power plants available for the hottest and coldest days. Every household pays them through the supply line on its bill. This auction is the starting point for the New Jersey bill spike: demand forecasts rose sharply, mostly on expected data centers, while new supply stayed flat."}, {"id": "d02", "date": "2025-02-12", "scopes": ["New Jersey", "NJ-06"], "category": "Rates & bills", "status": "Approved", "title": "BPU certifies supply auction; bills set to rise 17% to 20% on June 1", "summary": "The New Jersey Board of Public Utilities certified the annual Basic Generation Service auction. The average JCP&L residential bill rose from $112.25 to $134.92 a month (20.2%), and PSE&G from $155.84 to $182.71 (17.3%). BPU President Christine Guhl-Sadovy cited rapidly increasing demand and limited supply growth.", "value": "+$22.67/mo (JCP&L)", "sources": [{"label": "WHYY", "url": "https://whyy.org/articles/new-jersey-electricity-utility-bill-increase-june/"}, {"label": "NJ BPU", "url": "https://www.nj.gov/bpu/newsroom/2024/approved/20250212.html"}], "note": "This is where the grid story reaches NJ-06 kitchen tables. JCP&L serves most of Monmouth County, including Long Branch and Asbury Park. PSE&G serves much of Middlesex County, including New Brunswick. Both halves of the district took a double-digit increase in the same month, which explains why electricity costs became a top constituent issue."}, {"id": "d03", "date": "2025-07-22", "scopes": ["PJM grid"], "category": "Capacity market", "status": "Completed", "title": "2026/27 capacity auction clears at the $329.17 cap", "summary": "PJM's auction for June 2026 to May 2027 cleared at $329.17 per megawatt-day, 22% above the prior year and at the ceiling of a temporary price cap. Total cost reached $16.1 billion. PJM projected consumer bill increases of 1.5% to 5% depending on the state.", "value": "$329.17/MW-day", "sources": [{"label": "Utility Dive", "url": "https://www.utilitydive.com/news/pjm-interconnection-capacity-auction-prices/753798/"}, {"label": "PJM report", "url": "https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/2026-2027/2026-2027-bra-report.pdf"}], "note": "The cap, negotiated after Pennsylvania Governor Josh Shapiro challenged PJM, turned a potential shock into a smaller increase. It treats the symptom, not the cause: the price hit the ceiling, which means demand still outruns supply. Watch whether the cap is extended, since every later auction has run into it."}, {"id": "d04", "date": "2025-11-25", "scopes": ["New Jersey"], "category": "Projects & investment", "status": "Approved", "title": "CoreWeave's $1.8B Kenilworth AI data center wins first state AI tax credit", "summary": "CoreWeave received the first major award under New Jersey's Next New Jersey AI program: $250 million in tax credits over five years for a 250-megawatt, $1.8 billion data center in Kenilworth. The company expects it to open in early 2027 with 143 jobs. At full load it would use about as much power as 211,000 U.S. homes.", "value": "250 MW; $250M credit", "sources": [{"label": "Inside Climate News", "url": "https://insideclimatenews.org/news/26022026/new-jersey-data-center-tax-break/"}], "note": "This shows the policy tension in one project. The state was subsidizing AI data centers for jobs and growth while the same kind of demand was pushing up household bills. The Sherrill administration inherited the award from its predecessor. Gothamist later reported the administration canceled $250 million in previously allocated tech tax credits, the same amount as this award. Open question: whether it is the same credit."}, {"id": "d05", "date": "2025-12-17", "scopes": ["PJM grid"], "category": "Capacity market", "status": "Completed", "title": "2027/28 auction hits the cap again and falls 6.6 GW short", "summary": "PJM cleared the 2027/28 auction at the $333.44 per megawatt-day cap, for a total of $16.4 billion. The grid fell 6,623 MW short of its reliability standard. PJM said nearly 5,100 MW of the 5,250 MW rise in forecast peak demand came from data centers. Without the cap, the price would have been about $530.", "value": "$333.44/MW-day", "sources": [{"label": "PJM", "url": "https://insidelines.pjm.com/pjm-auction-procures-134479-mw-of-generation-resources/"}, {"label": "Utility Dive", "url": "https://www.utilitydive.com/news/pjm-interconnection-capacity-auction-data-center/808264/"}], "note": "The first time PJM admitted it could not buy enough capacity to meet its own reliability target. The 97% data center share of demand growth is the single most useful number for explaining this issue to a constituent. It moves the debate from prices to reliability."}, {"id": "d06", "date": "2026-01-07", "scopes": ["PJM grid"], "category": "Capacity market", "status": "Reported", "title": "Market monitor: data centers drove 40% of the latest auction's cost", "summary": "PJM's independent market monitor attributed $6.5 billion, or 40%, of the $16.4 billion December auction cost to data centers, about $6.2 billion of it for facilities not yet built. Across the last three auctions, forecast data center load accounted for $21.3 billion of $47.2 billion.", "value": "$6.5B of $16.4B", "sources": [{"label": "Utility Dive", "url": "https://www.utilitydive.com/news/data-centers-pjm-capacity-auction/808951/"}], "note": "The key detail is that most of the cost is for data centers that do not exist yet. Households are paying today for forecasts that may not materialize. That makes load forecasting, and who carries the risk if a project is canceled, a live policy question for Congress and state regulators."}, {"id": "d07", "date": "2026-01-20", "scopes": ["New Jersey"], "category": "State policy", "status": "Signed", "title": "Governor Sherrill's first executive orders target electric bills", "summary": "On her first day, Governor Mikie Sherrill signed Executive Order 1, using state funds to offset the June bill increase and letting the BPU pause utility actions that raise rates. Executive Order 2 declared an energy emergency to speed solar, storage and permitting, and required utilities to report on data center 'ghost loads.'", "value": "", "sources": [{"label": "NJ Governor", "url": "https://www.nj.gov/governor/news/2026/approved/20260120a.shtml"}], "note": "'Ghost loads' are requests for grid capacity from projects that may never be built. Requiring utilities to report them goes at the same problem the market monitor flagged. The orders also show the political weight of the issue: it was the governor's first act in office."}, {"id": "d08", "date": "2026-02-12", "scopes": ["New Jersey", "NJ-06"], "category": "Rates & bills", "status": "Approved", "title": "2026 supply auction keeps bills close to flat", "summary": "The BPU certified the 2026 auction. Starting June 1, 2026, the average JCP&L bill rose $2.23 to $137.47 (1.6%), and PSE&G fell $3.23 to $180.23 (-1.8%). Officials credited the capacity price cap.", "value": "JCP&L +1.6%; PSE&G -1.8%", "sources": [{"label": "ROI-NJ", "url": "https://www.roi-nj.com/2026/02/17/industry/energy-utilities/njbpu-certifies-2026-electricity-auction-jcpl-customers-to-see-1-6-increase/"}, {"label": "NJ BPU order", "url": "https://www.nj.gov/bpu/pdf/boardorders/2026/20260212/2A%20ORDER%202026%20BGS%20Auction%20Results.pdf"}], "note": "Flat is not the same as relief. Bills stayed near the higher 2025 level instead of falling back. The cap is doing the work, so the bill outlook for 2027 and beyond depends on whether it stays in place."}, {"id": "d09", "date": "2026-05-27", "scopes": ["New Jersey"], "category": "State policy", "status": "Proposed", "title": "Sherrill unveils a statewide plan to regulate data centers", "summary": "The plan requires data centers to help bring new clean energy online and pay for grid upgrades, report energy and water use, and follow statewide standards for community benefits agreements and labor. The governor said data centers drove 70% of PJM's projected demand growth. The New Jersey Business & Industry Association welcomed it, while a Stockton University poll found 56% of voters support local bans.", "value": "", "sources": [{"label": "NJ Governor", "url": "https://www.nj.gov/governor/news/2026/approved/20260527a.shtml"}, {"label": "NJBIZ", "url": "https://njbiz.com/sherrill-nj-data-center-regulations/"}], "note": "The state chose regulation over a ban: let data centers come, but make them pay their own way. That is the same basic approach Congress took later with the Ratepayer Protection Act. The gap between business support and voter support for bans previews the fight at the federal level."}, {"id": "d10", "date": "2026-06-10", "scopes": ["NJ-06"], "category": "Local action", "status": "Enacted", "title": "Asbury Park opposes data centers and calls for a statewide moratorium", "summary": "The Asbury Park City Council unanimously adopted a measure against data centers in the city and urged Governor Sherrill to impose a statewide moratorium on new facilities. Officials cited strain on the grid and water supply and pollution from backup generators. Mayor John Moor said data centers of this scale need land, water and power the city does not have to spare. Neptune later passed its own ban.", "value": "Unanimous", "sources": [{"label": "News 12 New Jersey", "url": "https://newjersey.news12.com/2026/06/18/asbury-park-calls-for-statewide-freeze-on-data-center-construction/3NokEGK7qKNnZPHdIGJTfU"}, {"label": "WBJB", "url": "https://www.wbjb.org/local-news/2026-06-19/asbury-park-calls-for-moratorium-on-ai-data-centers"}], "note": "The clearest NJ-06 signal on this tracker. Reports differ on whether the measure is a permanent ban or a pause on applications, though Gothamist counts Asbury Park among towns with bans. Either way, pairing local action with a demand on the state shows residents see this as bigger than one town. E&E News later cited this kind of local pressure as a driver of Pallone's push on data centers."}, {"id": "d11", "date": "2026-07-07", "scopes": ["New Jersey"], "category": "State policy", "status": "Signed", "title": "New Jersey enacts Data Center Fair Share law and bill credits", "summary": "Governor Sherrill signed an energy package including the Data Center Fair Share Act (S731/A796), which makes large data centers pay for their own energy use and grid upgrades. She announced a $25 credit for all 3.6 million ratepayers and an extra $150 for lower- and moderate-income households.", "value": "$25 credit per household", "sources": [{"label": "NJ Governor", "url": "https://www.nj.gov/governor/news/2026/20260707a.shtml"}], "note": "Fair Share addresses grid upgrade costs inside New Jersey. It cannot touch capacity prices, which are set across PJM's 13-state market. That limit is why state officials keep pointing to federal action and to pressure on PJM itself."}, {"id": "d12", "date": "2026-07-15", "scopes": ["PJM grid"], "category": "Capacity market", "status": "Completed", "title": "2028/29 auction at the cap for a third year; shortfall grows to 6.8 GW", "summary": "PJM's 2028/29 auction cleared at the $325 per megawatt-day cap, costing $16.4 billion. The reserve shortfall grew to 6.8 GW, and new resources added fell to 525 MW. Without the price collar, prices would have reached $555 and total cost $29.7 billion.", "value": "$325/MW-day", "sources": [{"label": "Utility Dive", "url": "https://www.utilitydive.com/news/pjm-capacity-auction-price-cap-reserve-shortfall/825282/"}, {"label": "PJM report", "url": "https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/2028-2029/2028-2029-bra-results-report.pdf"}], "note": "The cap is holding down bills, but it may also be dampening the price signal meant to attract new power plants. The gap between capped cost ($16.4 billion) and uncapped cost ($29.7 billion) shows how much risk is being deferred. This is the core trade-off for anyone writing policy on this issue."}, {"id": "d13", "date": "2026-07-22", "scopes": ["National"], "category": "Gulf & foreign capital", "status": "Completed", "title": "Abu Dhabi's MGX and BlackRock close $40B Aligned Data Centers deal", "summary": "MGX, BlackRock's Global Infrastructure Partners and the AI Infrastructure Partnership closed their acquisition of Aligned Data Centers: 51 campuses and 6.4 GW of operating and planned capacity. The buyers committed another $5 billion for expansion. It is the largest data center acquisition on record.", "value": "$40B", "sources": [{"label": "Data Center Dynamics", "url": "https://www.datacenterdynamics.com/en/news/mgx-aip-and-blackrocks-gip-complete-40bn-acquisition-of-aligned-data-centers/"}, {"label": "Business Wire", "url": "https://www.businesswire.com/news/home/20260720395324/en/AIP-MGX-and-BlackRocks-GIP-Close-Acquisition-of-Aligned-Data-Centers"}], "note": "The link to the Gulf Statecraft Tracker. MGX is a UAE state-backed vehicle and part of the same capital-for-technology bargain behind the UAE AI Campus. Gulf money now owns part of the U.S. data center buildout that drives grid demand, so ratepayer protection is also a foreign investment question. Open question: how many Aligned campuses sit in PJM territory."}, {"id": "d14", "date": "2026-07-29", "scopes": ["National", "NJ-06"], "category": "Federal policy", "status": "Announced", "title": "Pallone lays out a data center strategy for Energy and Commerce", "summary": "Rep. Frank Pallone, top Democrat on the House Energy and Commerce Committee, said he would pursue federal pollution rules, siting standards and ratepayer protections, and kept a national construction moratorium on the table as leverage. His staff is meeting with major AI and cloud companies, and he wrote to SpaceXAI for emissions, power and water data on its Colossus sites.", "value": "", "sources": [{"label": "E&E News / POLITICO", "url": "https://www.eenews.net/articles/pallone-plots-data-center-crackdown/"}], "note": "E&E News tied the push directly to his district, where about half a dozen towns had imposed moratoriums or rejected projects. This is the entry an intern in his office should know cold. It combines oversight letters, the committee's jurisdiction over energy, and a clear constituent driver."}, {"id": "d15", "date": "2026-08-12", "scopes": ["New Jersey"], "category": "Projects & investment", "status": "Ongoing", "title": "Vineland halts parts of a 300 MW AI data center over permits", "summary": "Vineland issued two stop-work orders to developer DataOne over a 1.5-million-gallon LNG storage tank and Bloom Energy fuel cells installed without construction permits. The site is being built for Nebius under its AI infrastructure deal with Microsoft. Violations carry $2,000 per-day penalties.", "value": "300 MW", "sources": [{"label": "WHYY", "url": "https://whyy.org/articles/vineland-data-center-stop-work-orders/"}], "note": "On-site gas power is how developers get around a grid that cannot connect them fast enough. It takes the pressure off household bills but moves the conflict to air permits, fuel storage and local approvals. Expect more projects to try this model as PJM shortfalls grow."}, {"id": "d16", "date": "2026-08-20", "scopes": ["New Jersey"], "category": "Local action", "status": "Ongoing", "title": "Data center developers take New Jersey towns to court", "summary": "Hexa Builders sued Monroe Township for $300 million in federal court, E. Khan Development sued Montgomery for $300 million, and National Land Developers sued Andover Township. One suit calls a local ordinance the product of 'public hysteria.' Another argues data centers are protected expression under the First Amendment.", "value": "$600M+ claimed", "sources": [{"label": "New Jersey Monitor", "url": "https://newjerseymonitor.com/2026/08/20/nj-data-center-bans-courts/"}], "note": "The local bans now face legal tests. If courts side with developers, the fight moves back to Trenton and Washington, which raises the stakes for state siting rules and for Pallone's federal standards."}, {"id": "d17", "date": "2026-08-27", "scopes": ["New Jersey"], "category": "State policy", "status": "Enacted", "title": "New law requires data centers to report energy and water use", "summary": "Governor Sherrill signed S3379/A4096 (P.L.2026, c.75). Data center owners must report to the BPU twice a year on total energy use, energy for cooling and computing equipment, and peak daily water use. The state also launched a resource hub to help towns negotiate community benefits agreements, and towns keep the power to ban data centers.", "value": "Twice-yearly reports", "sources": [{"label": "NJ Governor", "url": "https://www.nj.gov/governor/news/2026/20260827a.shtml"}, {"label": "Rutgers Policy Lab", "url": "https://policylab.rutgers.edu/august-31-2026-new-jersey-state-policy-updates/"}], "note": "Disclosure comes first because regulators cannot plan for load they cannot see. A separate rate class for data centers is the practical tool for keeping their costs off household bills. It is a model federal bills could copy."}, {"id": "d18", "date": "2026-09-02", "scopes": ["New Jersey", "NJ-06"], "category": "Local action", "status": "Reported", "title": "93 New Jersey towns now ban data centers; no statewide moratorium", "summary": "Gothamist counted 93 of New Jersey's 564 municipalities with data center bans, including Asbury Park and Neptune. A Fairleigh Dickinson poll found 65% support for halting construction until new power plants are built. Governor Sherrill rejected a statewide moratorium in favor of local control and state rules.", "value": "93 of 564", "sources": [{"label": "Gothamist", "url": "https://gothamist.com/news/nearly-100-nj-towns-have-banned-data-centers-dont-expect-a-statewide-prohibition-soon"}], "note": "Bans spread quickly, from about eight towns in June to 93 by September. Public opinion is ahead of state policy. For a House office, that gap shows up as constituent calls and letters, which is exactly the work a district or DC intern handles."}, {"id": "d19", "date": "2026-09-16", "scopes": ["National"], "category": "Federal policy", "status": "Passed", "title": "House passes Ratepayer Protection Act 417-3", "summary": "The House passed a bill from Rep. Gabe Evans (R-Colo.) requiring large data centers to pay for new power infrastructure and encouraging state regulators to bill large-load customers for the generation they need. Pallone called it 'imperfect' and said it addresses only one part of the problem. It then went to the Senate, which blocked it on September 30.", "value": "417-3", "sources": [{"label": "CBS News", "url": "https://www.cbsnews.com/news/house-bill-data-center-energy-costs/"}, {"label": "AP via U.S. News", "url": "https://www.usnews.com/news/politics/articles/2026-09-16/house-passes-bill-aimed-at-addressing-impact-of-data-centers-on-energy-costs"}], "note": "A near-unanimous vote shows how broad the concern is across parties. Pallone voted to move it while signaling more to come, the usual position of a ranking member. The Senate later fell three votes short of taking it up (see the September 30 entry). Watch whether Energy and Commerce Democrats push siting and pollution provisions in a follow-up bill."}, {"id": "d20", "date": "2026-09-28", "scopes": ["National", "PJM grid", "NJ-06"], "category": "Federal policy", "status": "Announced", "title": "Pallone asks FERC to strengthen PJM's data center rules", "summary": "In a September 28 letter to FERC Chairman Laura Swett, Rep. Frank Pallone urged the commission to approve and strengthen PJM's proposals for connecting data centers. PJM's plan would make data centers pay for new power plants, require them to bring new generation, and create a registry of data centers. Pallone asked FERC to make data centers cover all the costs they cause, make the self-supply requirement permanent, and make the registry public.", "value": "3 requests to FERC", "sources": [{"label": "House Energy and Commerce Democrats", "url": "https://democrats-energycommerce.house.gov/media/press-releases/pallone-urges-ferc-protect-pjm-customers-stronger-data-center-rules"}, {"label": "ROI-NJ", "url": "https://www.roi-nj.com/2026/09/29/industry/energy-utilities/pallone-urges-ferc-to-shield-pjm-customers-with-strong-rules-for-data-centers/"}], "note": "FERC decides here, because PJM cannot change its market rules without the commission's approval. The letter ties the request to the district: it cites a 20% bill increase for Pallone's constituents last year and a rise of nearly $30 billion in PJM capacity costs since summer 2024. It also shows how a ranking member works from the minority, using letters to regulators while legislation is stalled. Watch FERC's ruling on the data center framework PJM filed in August."}, {"id": "d21", "date": "2026-09-29", "scopes": ["PJM grid"], "category": "Capacity market", "status": "Ongoing", "title": "FERC suspends PJM's backstop power auction; bidding window pulled", "summary": "FERC accepted PJM's Reliability Backstop Procurement, a special auction for about 6.8 GW of new capacity to cover the grid's reserve shortfall, but suspended it for five months, until February 28, 2027, subject to refund and further proceedings. The commission flagged problems with cost allocation, transmission owner exit rules and collateral requirements. PJM canceled the bidding window that was set to open September 30 and has not announced a new timeline.", "value": "6.8 GW on hold", "sources": [{"label": "Utility Dive", "url": "https://www.utilitydive.com/news/pjm-delays-backstop-procurement-ferc-data-center/831751/"}, {"label": "PJM", "url": "https://insidelines.pjm.com/ferc-accepts-pjm-reliability-backstop-proposal/"}], "note": "Who pays is the unresolved question: FERC said PJM had not shown its plan for dividing the auction's costs was just and reasonable. The backstop offer cap is $555 per megawatt-day, well above the $325 capacity price cap, so the allocation decides how much lands on households. The two sources frame the order differently. Utility Dive calls it a partial approval and quotes Chairman Swett describing a 'deeply flawed, eleventh-hour' filing, while PJM says FERC accepted the proposal and gave a clear path to fix three discrete issues. The order came one day after Pallone's letter to FERC, and the delay leaves the 6.8 GW shortfall without a scheduled remedy."}, {"id": "d22", "date": "2026-09-30", "scopes": ["National"], "category": "Federal policy", "status": "Ongoing", "title": "Senate blocks the Ratepayer Protection Act, 57-43", "summary": "The Senate voted 57-43 on a motion to end debate and take up the House-passed Ratepayer Protection Act (H.R. 9340), three votes short of the 60 required. Four Democrats (Hassan, Klobuchar, Ossoff and Warnock) joined all Republicans in favor, and New Jersey Senators Cory Booker and Andy Kim voted no. An earlier attempt by Sen. Jon Husted (R-Ohio) to pass the bill by unanimous consent on September 17 was blocked by a Democratic objection.", "value": "57-43; 60 needed", "sources": [{"label": "U.S. Senate roll call vote", "url": "https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192/vote_119_2_00254.htm"}, {"label": "Sen. Husted release", "url": "https://www.husted.senate.gov/media/press-releases/democrats-block-husteds-bill-forcing-data-centers-to-pay-their-own-way/"}], "note": "A bill that passed the House 417-3 stalled in the Senate, where 60 votes are needed to proceed. The dispute is over strength, not the goal. The bill requires states to consider a standard for charging large-load customers, not to adopt one. Senate Democratic leaders said that is too weak, and Republican sponsors said it would make tech companies pay their own way. The Husted release is the sponsor's account and is cited for the September 17 detail. With senators leaving to campaign, further action is unlikely before the November election. For Pallone, who called the House bill imperfect, the result keeps room open for a stronger bill and shifts near-term attention to FERC and the states."}, {"id": "d23", "date": "2026-10-01", "scopes": ["New Jersey"], "category": "Projects & investment", "status": "Reported", "title": "Vineland data center ran 62 unpermitted gas generators before $1 million state fine", "summary": "New Jersey Monitor reported that DataOne's Vineland data center began running gas-fired generators without air permits in October 2025 and had all 62 operating by June 2026, for more than 46,000 combined hours. State inspectors found them on July 29. The Department of Environmental Protection fined DataOne on September 22 and ordered it to obtain permits or stop operating, and a Rutgers scientist estimated the generators emitted about 140 tons of nitrogen oxides.", "value": "$1.07M fine", "sources": [{"label": "New Jersey Monitor", "url": "https://newjerseymonitor.com/2026/10/01/nj-data-center-polluted-air-for-nearly-a-year-before-regulators-intervened/"}, {"label": "ROI-NJ", "url": "https://www.roi-nj.com/2026/09/23/politics/state-fines-dataone-1m-for-pollution-permit-violations-involving-vineland-data-center/"}], "note": "This follows Vineland's August stop-work orders at the same site. The state DEP decides air permits and the city decides construction permits, and the generators kept running during a 45-day compliance period, according to New Jersey Monitor. Outlets differ slightly on details: New Jersey Monitor gives the fine as $1 million, while ROI-NJ reports $1.07 million and calls it the largest enforcement action against a data center in the state. On-site gas power keeps a project off the strained grid but moves the cost to local air quality. That is the gap Pallone has said federal pollution rules for data centers should close."}, {"id": "d24", "date": "2026-10-07", "scopes": ["National", "PJM grid"], "category": "Federal policy", "status": "Ongoing", "title": "Energy Department backs FERC push to make data centers pay for PJM backstop power", "summary": "The U.S. Department of Energy filed a statement of position at FERC supporting the commission's September order that PJM revise cost allocation and other parts of its Reliability Backstop Procurement. DOE said costs of serving new large loads should not shift to existing customers and that PJM needs project-level data to track whether data centers are built, delayed or canceled. PJM plans to file a revised proposal by October 29, after a special Members Committee meeting on October 22.", "value": "Revised plan due Oct. 29", "sources": [{"label": "U.S. Department of Energy", "url": "https://www.energy.gov/node/4860601"}, {"label": "Utility Dive", "url": "https://utilitydive.com/news/doe-pjm-ferc-ratepayer-protection-large-load-data-center/832479"}], "note": "FERC decides, but the administration, Pallone and the states are now pushing in the same direction: data centers, not households, should pay for the 6.8 GW of backstop capacity. Utility Dive says this appears to be DOE's first FERC filing in at least five years, and DOE ties it to the White House's voluntary Ratepayer Protection Pledge. The data point matters because forecast data center load that never shows up still raises costs for everyone. Watch PJM's October 29 refiling and whether it adopts the public data center registry Pallone asked FERC to require."}, {"id": "d25", "date": "2026-10-09", "scopes": ["National", "PJM grid"], "category": "Capacity market", "status": "Approved", "title": "FERC approves PJM's data center registry but rejects its curtailment plan", "summary": "FERC approved PJM's definition of large loads and a registry that will track each data center's location, ramp schedule, power supply and backup generation. It rejected most of PJM's Interim Resource Adequacy Service, which would have let new data centers connect without matching new capacity if they agreed to be cut off before grid emergencies, along with the related bring-your-own-new-capacity rules. FERC said those provisions intrude on state authority over retail customers and appear to discriminate against large loads.", "value": "Registry approved; IRAS rejected", "sources": [{"label": "Utility Dive", "url": "https://www.utilitydive.com/news/ferc-pjm-large-load-interconnection-iras-byonc/832716/"}, {"label": "Data Center Dynamics", "url": "https://www.datacenterdynamics.com/en/news/ferc-approves-pjms-request-to-create-data-center-database/"}], "note": "FERC decided, and its message is that the states, not PJM, must set rules for which customers get cut off and who pays for new supply. Commissioner David Rosner urged state regulators to curtail non-critical data centers before homes, hospitals and schools. Jefferies analysts told Utility Dive the ruling could mean higher capacity prices for longer. For Pallone's office, one of his three requests to FERC, a data center registry, is now approved, but neither source says whether it will be public, and the self-supply requirement he wanted made permanent was rejected. Watch PJM's revised backstop filing due October 29 and New Jersey BPU action on curtailment rules."}, {"id": "d26", "date": "2026-10-15", "scopes": ["New Jersey"], "category": "Local action", "status": "Reported", "title": "Rutgers poll: 72% of New Jerseyans oppose a data center in their own town", "summary": "A Rutgers-Eagleton poll of 1,004 adults, taken September 24 to 27, found 55% say data center costs such as electricity and water use and possible rate increases outweigh the jobs and tax revenue, while 11% say the benefits are greater. Opposition was 72% to a data center in respondents' own town, 64% in a neighboring county and 62% anywhere in the state. Poll director Ashley Koning said no group reaches majority support anywhere.", "value": "72% oppose locally", "sources": [{"label": "ROI-NJ", "url": "https://www.roi-nj.com/2026/10/16/industry/energy-utilities/rutgers-poll-finds-55-of-new-jerseyans-say-data-center-costs-outweigh-benefits/"}, {"label": "News 12 New Jersey", "url": "https://newjersey.news12.com/poll-shows-widespread-opposition-to-data-centers-and-growing-public-anxiety-over-ais-impact"}], "note": "This is the third statewide poll on the tracker showing broad opposition, after Stockton (56% back local bans) and Fairleigh Dickinson (65% back a pause). Opposition is strongest closest to home, which helps explain why towns keep passing bans while the governor favors state rules over a statewide moratorium. The margin of error is 4.1 points. For a House office, the numbers suggest constituent pressure on data centers will stay high through the election."}], "national": {"asOf": "2024 and 2025", "metrics": [{"label": "Average monthly bill, 2024", "nj": 128.13, "us": 142.26, "fmt": "usd", "src": "EIA", "url": "https://www.eia.gov/electricity/sales_revenue_price/pdf/table_5A.pdf"}, {"label": "Average price, 2024 (cents per kWh)", "nj": 19.34, "us": 16.48, "fmt": "cents", "src": "EIA", "url": "https://www.eia.gov/electricity/sales_revenue_price/pdf/table_5A.pdf"}, {"label": "Increase in annual bill, 2025", "nj": 16.9, "us": 6.4, "fmt": "pct", "extra": {"nj": "+$260/yr", "us": "+$110/yr"}, "src": "JEC Democrats, EIA data", "url": "https://www.jec.senate.gov/public/_cache/files/988cf92d-c7a6-47d3-a564-28b9880e43ee/26.03.05---updated-fact-sheet-on-state-by-state-electricity-cost-increases.pdf"}]}}</script>
<script id="app-js">
(function(){
  var STATE = JSON.parse(document.getElementById('tracker-data').textContent);
  var SCOPES = ['National','PJM grid','New Jersey','NJ-06'];
  var SCOPE_DESC = {'National':'Congress, federal agencies, national capital','PJM grid':'The 13-state power market that sets capacity prices','New Jersey':'Governor, Legislature, BPU, statewide projects','NJ-06':'Monmouth and Middlesex towns in Pallone’s district'};
  var CATEGORIES = ['Capacity market','Rates & bills','Federal policy','State policy','Local action','Projects & investment','Gulf & foreign capital'];
  var STATUSES = ['Proposed','Announced','Reported','Approved','Passed','Signed','Enacted','Completed','Ongoing'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var ui = { q:'', scope:'', category:'', canEdit:false, editing:null, confirmDel:null, busy:false, msg:'' };
  var artifactNs = null;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function safeUrl(u){ return /^https?:\/\//i.test(u||'') ? u : '#'; }
  function fmtDate(d){ var p=d.split('-'); return MONTHS[+p[1]-1]+' '+(+p[2])+', '+p[0]; }
  function monthKey(d){ return d.slice(0,7); }
  function monthLabel(k){ var p=k.split('-'); return MONTHS[+p[1]-1]+' '+p[0]; }
  function money(v){ return '$'+v.toFixed(2); }
  function sorted(){ return STATE.entries.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1); }); }
  function filtered(){
    var q = ui.q.trim().toLowerCase();
    return sorted().filter(function(e){
      if (ui.scope && e.scopes.indexOf(ui.scope)<0) return false;
      if (ui.category && e.category!==ui.category) return false;
      if (q){ var hay=(e.title+' '+e.summary+' '+e.note+' '+e.category+' '+e.scopes.join(' ')).toLowerCase(); if (hay.indexOf(q)<0) return false; }
      return true;
    });
  }
  function statusClass(s){ return STATUSES.indexOf(s)>=0 ? 'st-'+s : 'st-other'; }

  function renderStrip(){
    return '<div class="strip">'+(STATE.keyNumbers||[]).map(function(n){
      return '<button type="button" class="stat" data-goto="'+esc(n.entry||'')+'"><span class="k">'+esc(n.k)+'</span><span class="v">'+esc(n.v)+'</span><span class="s">'+esc(n.s)+'</span></button>';
    }).join('')+'</div>';
  }

  function renderLedger(){
    return '<div class="ledger" role="group" aria-label="Filter by level">'+SCOPES.map(function(c){
      var list = sorted().filter(function(e){return e.scopes.indexOf(c)>=0;});
      var ticks = list.slice().reverse().map(function(e){return '<span class="tick" title="'+esc(fmtDate(e.date)+': '+e.title)+'"></span>';}).join('');
      var last = list[0] ? fmtDate(list[0].date)+': '+list[0].title : 'No entries yet';
      return '<button type="button" class="lane" data-scope="'+esc(c)+'" aria-pressed="'+(ui.scope===c)+'">'+
        '<span class="name">'+esc(c)+'<span>'+list.length+'</span></span>'+
        '<span class="desc">'+esc(SCOPE_DESC[c]||'')+'</span>'+
        '<span class="ticks">'+ticks+'</span>'+
        '<span class="last">'+esc(last)+'</span></button>';
    }).join('')+'</div>';
  }

  function capacityChart(rows){
    var W=520,H=250,L=44,R=12,T=16,B=34, max=600, pw=W-L-R, ph=H-T-B;
    var y=function(v){ return T+ph-(v/max*ph); };
    var ticks=[0,150,300,450,600];
    var g = ticks.map(function(v){ return '<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(v===0?'0':'$'+v)+'</text>'; }).join('');
    var slot=pw/rows.length, bw=Math.min(56,slot*0.5);
    var cols = rows.map(function(r,i){
      var cx=L+slot*i+slot/2, x=cx-bw/2;
      var ghost = r.uncapped ? '<rect class="ghost" x="'+x+'" y="'+y(r.uncapped)+'" width="'+bw+'" height="'+(y(r.price)-y(r.uncapped))+'"/><text x="'+cx+'" y="'+(y(r.uncapped)-6)+'" text-anchor="middle">~$'+r.uncapped+'</text>' : '';
      var tip = r.dy+': cleared at $'+r.price.toFixed(2)+'/MW-day'+(r.uncapped?' (about $'+r.uncapped+' without the cap)':'');
      return '<g class="colg" data-goto="'+esc(r.entry)+'" data-tip="'+esc(tip)+'" tabindex="0" role="button" aria-label="'+esc(tip)+'">'+ghost+
        '<rect class="col" x="'+x+'" y="'+y(r.price)+'" width="'+bw+'" height="'+(y(0)-y(r.price))+'"/>'+
        (r.uncapped?'':'<text class="val" x="'+cx+'" y="'+(y(r.price)-6)+'" text-anchor="middle">$'+Math.round(r.price)+'</text>')+
        (r.uncapped?'<text class="val" x="'+cx+'" y="'+(y(r.price)+14)+'" text-anchor="middle" style="fill:var(--surface)">$'+Math.round(r.price)+'</text>':'')+
        '<text x="'+cx+'" y="'+(H-B+18)+'" text-anchor="middle">'+esc(r.dy)+'</text>'+
        '<rect class="hit" x="'+(cx-slot/2)+'" y="'+T+'" width="'+slot+'" height="'+ph+'"/></g>';
    }).join('');
    return '<div class="svgbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="PJM capacity clearing price by delivery year">'+g+'<line class="base" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>'+cols+'</svg></div>';
  }

  function billChart(rows){
    var max=200, ticks=[0,50,100,150,200];
    var gl = ticks.map(function(v){ return '<span class="tgl" style="left:'+(v/max*100)+'%"></span>'; }).join('');
    function bar(who,v,color,entry,period){
      var pct=v/max*100, tip=who+', '+period+': '+money(v)+' a month';
      return '<button type="button" class="brow" data-goto="'+esc(entry)+'" data-tip="'+esc(tip)+'" aria-label="'+esc(tip)+'"><span class="who">'+esc(who)+'</span>'+
        '<span class="track"><span class="track-inner">'+gl+'<span class="bar" style="width:'+pct+'%;background:var('+color+')"></span><span class="bar-val" style="left:'+pct+'%">'+money(v)+'</span></span></span></button>';
    }
    var body = rows.map(function(r){
      return '<div class="bgroup"><span class="gl-label">'+esc(r.period)+'</span>'+bar('JCP&amp;L'.replace('&amp;','&'),r.jcpl,'--c-jcpl',r.entry,r.period)+bar('PSE&G',r.pseg,'--c-pseg',r.entry,r.period)+'</div>';
    }).join('');
    var axis = '<div class="axis"><span></span><div class="ticks-x">'+ticks.map(function(v,i){ return '<span style="left:'+(v/max*100)+'%">'+(i===0?'0':'$'+v)+'</span>'; }).join('')+'</div></div>';
    return '<div class="bars">'+body+'</div>'+axis;
  }

  function tableOf(rows, cols){
    return '<details class="tbl"><summary>View as table</summary><div class="tbl-wrap"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c[0])+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){ return '<tr>'+cols.map(function(c){ return '<td'+(c[2]?' class="n"':'')+'>'+esc(c[1](r))+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div></details>';
  }

  function renderMoney(){
    var cap=STATE.capacity||[], bills=STATE.bills||[];
    return '<section class="money" aria-labelledby="money-h">'+
      '<h2 id="money-h">From the grid to your bill</h2>'+
      '<p>Data center demand drove PJM’s capacity price to a record in 2024, and New Jersey households paid for it starting June 2025. A temporary price cap has held prices roughly flat since, while the gap between demand and supply keeps growing.</p>'+
      '<div class="charts">'+
        '<div class="chart"><h3>PJM capacity price by delivery year</h3><p class="sub">Dollars per megawatt-day, June to May delivery years</p>'+
          '<div class="legend"><span><i class="sw" style="background:var(--c-cap)"></i>Cleared price</span><span><i class="sw ghost"></i>Estimated price without the cap</span></div>'+
          capacityChart(cap)+
          tableOf(cap,[['Delivery year',function(r){return r.dy;}],['Cleared',function(r){return '$'+r.price.toFixed(2);},1],['Without cap',function(r){return r.uncapped?'~$'+r.uncapped:'n/a';},1]])+
        '</div>'+
        '<div class="chart"><h3>Average monthly residential bill</h3><p class="sub">JCP&amp;L serves most of Monmouth County; PSE&amp;G serves much of Middlesex. As reported by the BPU.</p>'+
          '<div class="legend"><span><i class="sw" style="background:var(--c-jcpl)"></i>JCP&amp;L</span><span><i class="sw" style="background:var(--c-pseg)"></i>PSE&amp;G</span></div>'+
          billChart(bills)+
          tableOf(bills,[['Period',function(r){return r.period;}],['JCP&L',function(r){return money(r.jcpl);},1],['PSE&G',function(r){return money(r.pseg);},1]])+
        '</div>'+
      '</div>'+renderNational()+'</section>';
  }


  function nfmt(v,f){ return f==='usd'?money(v):f==='cents'?v.toFixed(2)+'¢':'+'+v.toFixed(1)+'%'; }
  function renderNational(){
    var n=STATE.national; if(!n||!n.metrics) return '';
    var body=n.metrics.map(function(m){
      var max=Math.max(m.nj,m.us)*1.15;
      function bar(who,v,color,ex){ var pct=v/max*100, tip=who+', '+m.label+': '+nfmt(v,m.fmt)+(ex?' ('+ex+')':'');
        return '<div class="brow" data-tip="'+esc(tip)+'" tabindex="0" aria-label="'+esc(tip)+'"><span class="who">'+esc(who)+'</span><span class="track"><span class="track-inner"><span class="bar" style="width:'+pct+'%;background:var('+color+')"></span><span class="bar-val" style="left:'+pct+'%">'+esc(nfmt(v,m.fmt))+'</span></span></span></div>'; }
      return '<div class="nmetric"><span class="gl-label">'+esc(m.label)+'</span>'+bar('N.J.',m.nj,'--c-nj',m.extra&&m.extra.nj)+bar('U.S.',m.us,'--c-us',m.extra&&m.extra.us)+
        (m.extra?'<span class="srcl">N.J. '+esc(m.extra.nj)+' vs. U.S. '+esc(m.extra.us)+'</span>':'')+
        '<span class="srcl">Source: <a href="'+esc(safeUrl(m.url))+'" target="_blank" rel="noopener">'+esc(m.src)+'</a></span></div>';
    }).join('');
    return '<div class="natl"><h3>New Jersey vs. the national average</h3><p class="sub">New Jersey households use less power than the average American home but pay more per kilowatt-hour, and their bills rose more than twice as fast as the nation’s in 2025. Statewide averages from EIA, so they differ from the BPU typical bills above.</p>'+
      '<div class="legend"><span><i class="sw" style="background:var(--c-nj)"></i>New Jersey</span><span><i class="sw" style="background:var(--c-us)"></i>U.S. average</span></div>'+
      '<div class="nrows">'+body+'</div></div>';
  }

  function renderControls(n){
    var cats = '<option value="">All categories</option>'+CATEGORIES.map(function(c){return '<option'+(ui.category===c?' selected':'')+'>'+esc(c)+'</option>';}).join('');
    return '<div class="controls">'+
      '<input id="q" type="search" placeholder="Search entries and analysis" aria-label="Search" value="'+esc(ui.q)+'">'+
      '<select id="cat" aria-label="Category">'+cats+'</select>'+
      (ui.scope?'<button type="button" class="btn ghost small" id="clear-scope">'+esc(ui.scope)+' ×</button>':'')+
      (ui.canEdit && !ui.editing ? '<button type="button" class="btn" id="add">Add entry</button>' : '')+
      '<span class="count">'+n+' shown</span></div>';
  }

  function renderEntry(e){
    var noteHtml = (e.note||'').trim()
      ? '<div class="note"><span class="k">Analysis</span><p>'+esc(e.note)+'</p></div>'
      : (ui.canEdit ? '<div class="note empty"><span class="k">Analysis</span><p>No analysis yet. Use Edit to add why this matters.</p></div>' : '');
    var tools = '';
    if (ui.canEdit){
      tools = ui.confirmDel===e.id
        ? '<div class="tools"><span class="hint">Delete this entry for good?</span><button type="button" class="btn danger small" data-act="del-yes" data-id="'+esc(e.id)+'">Delete</button><button type="button" class="btn ghost small" data-act="del-no">Keep</button></div>'
        : '<div class="tools"><button type="button" class="btn ghost small" data-act="edit" data-id="'+esc(e.id)+'">Edit</button><button type="button" class="btn ghost small" data-act="del" data-id="'+esc(e.id)+'">Delete</button></div>';
    }
    return '<article class="entry'+(e.category==='Gulf & foreign capital'?' gulf':'')+'" id="'+esc(e.id)+'">'+
      '<div class="meta"><span class="date">'+esc(fmtDate(e.date))+'</span>'+
        e.scopes.map(function(c){return '<span class="chip scope">'+esc(c)+'</span>';}).join('')+
        '<span class="chip">'+esc(e.category)+'</span><span class="pill '+statusClass(e.status)+'">'+esc(e.status)+'</span></div>'+
      '<div class="row"><h3>'+esc(e.title)+'</h3>'+(e.value?'<span class="value">'+esc(e.value)+'</span>':'')+'</div>'+
      '<p class="summary">'+esc(e.summary)+'</p>'+noteHtml+
      (e.sources&&e.sources.length?'<div class="sources">Sources: '+e.sources.map(function(s){return '<a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener">'+esc(s.label||s.url)+'</a>';}).join('')+'</div>':'')+
      tools+'</article>';
  }

  function renderTimeline(list){
    if (!list.length) return '<div class="empty-state">No entries match these filters.</div>';
    var groups=[], cur=null;
    list.forEach(function(e){ var k=monthKey(e.date); if(!cur||cur.k!==k){cur={k:k,items:[]};groups.push(cur);} cur.items.push(e); });
    return '<div class="timeline">'+groups.map(function(g){
      return '<section class="month"><div class="mlabel">'+esc(monthLabel(g.k))+'</div><div class="entries">'+g.items.map(renderEntry).join('')+'</div></section>';
    }).join('')+'</div>';
  }

  function renderEditor(){
    var e = ui.editing; if (!e) return '';
    var isNew = !STATE.entries.some(function(x){return x.id===e.id;});
    var src = (e.sources||[]).concat([{label:'',url:''},{label:'',url:''}]).slice(0,2);
    function opts(list,val){ return list.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';}).join(''); }
    return '<form class="editor" id="editor" novalidate><h2>'+(isNew?'New entry':'Edit entry')+'</h2>'+
      '<div class="grid2">'+
        '<div class="field"><label for="f-date">Date</label><input id="f-date" type="date" required value="'+esc(e.date)+'"></div>'+
        '<div class="field"><label for="f-value">Headline figure</label><input id="f-value" placeholder="e.g. $325/MW-day" value="'+esc(e.value)+'"></div>'+
        '<div class="field"><label for="f-cat">Category</label><select id="f-cat">'+opts(CATEGORIES,e.category)+'</select></div>'+
        '<div class="field"><label for="f-status">Status</label><select id="f-status">'+opts(STATUSES,e.status)+'</select></div>'+
      '</div>'+
      '<fieldset class="field"><legend>Level</legend><div class="checks">'+SCOPES.map(function(c,i){
        return '<label><input type="checkbox" id="f-c'+i+'" value="'+esc(c)+'"'+(e.scopes.indexOf(c)>=0?' checked':'')+'> '+esc(c)+'</label>';
      }).join('')+'</div></fieldset>'+
      '<div class="field"><label for="f-title">Headline</label><input id="f-title" required value="'+esc(e.title)+'"></div>'+
      '<div class="field"><label for="f-summary">What happened (facts only)</label><textarea id="f-summary">'+esc(e.summary)+'</textarea></div>'+
      '<div class="field"><label for="f-note">Analysis: why it matters</label><textarea id="f-note" placeholder="Who pays, who decides, and what to watch next.">'+esc(e.note)+'</textarea></div>'+
      '<div class="grid2">'+
        '<div class="field"><label for="f-s0l">Source 1 name</label><input id="f-s0l" value="'+esc(src[0].label)+'"></div>'+
        '<div class="field"><label for="f-s0u">Source 1 link</label><input id="f-s0u" type="url" value="'+esc(src[0].url)+'"></div>'+
        '<div class="field"><label for="f-s1l">Source 2 name</label><input id="f-s1l" value="'+esc(src[1].label)+'"></div>'+
        '<div class="field"><label for="f-s1u">Source 2 link</label><input id="f-s1u" type="url" value="'+esc(src[1].url)+'"></div>'+
      '</div>'+
      (ui.msg?'<div class="msg" role="status">'+esc(ui.msg)+'</div>':'')+
      '<div class="tools"><button class="btn" type="submit"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'Saving…':'Save and publish')+'</button><button class="btn ghost" type="button" id="cancel">Cancel</button></div>'+
      '<p class="hint">Saving publishes a new version of this page for everyone who has the link.</p></form>';
  }

  function render(){
    var list = filtered();
    var focusId = document.activeElement && document.activeElement.id;
    document.getElementById('app').innerHTML =
      '<div class="wrap"><header class="mast">'+
        '<span class="eyebrow">Energy &amp; Commerce · New Jersey’s 6th District</span>'+
        '<h1>NJ-06 Grid Cost Tracker</h1>'+
        '<p class="lede">How AI data center growth reaches household electric bills in Monmouth and Middlesex counties: PJM capacity auctions, New Jersey rate decisions, state and local rules, and the federal response led in part by Rep. Frank Pallone on the Energy and Commerce Committee.</p>'+
        '<div class="byline"><span>Maintained by <strong>Xavier Davis</strong></span><span>Long Branch, NJ · School of International Service, American University</span><span>Last updated '+esc(fmtDate(STATE.updated))+'</span></div>'+
      '</header>'+
      renderStrip()+renderLedger()+renderMoney()+renderEditor()+renderControls(list.length)+renderTimeline(list)+
      '<footer class="about">'+
        '<div><h4>What counts</h4><p>PJM capacity auctions, New Jersey rate and supply decisions, state and local data center rules, federal legislation and oversight, and major data center deals, including Gulf sovereign capital tracked in the companion Gulf Statecraft Tracker.</p></div>'+
        '<div><h4>Reading the figures</h4><p>Bills are BPU averages for a typical residential customer. Capacity prices are PJM’s regional clearing prices; New Jersey zones can differ. Uncapped prices are estimates reported by PJM and trade press. National comparisons use U.S. Energy Information Administration data.</p></div>'+
        '<div><h4>Status key</h4><p>Proposed, Announced or Reported: stated or found, not binding. Approved, Passed or Signed: formally acted on. Enacted or Completed: in force or closed. Ongoing: still unfolding.</p></div>'+
      '</footer></div>';
    if (focusId){ var el=document.getElementById(focusId); if(el){ el.focus(); if(el.id==='q'){ try{ el.setSelectionRange(el.value.length,el.value.length);}catch(_){} } } }
  }

  function readForm(){
    var e = ui.editing;
    var g = function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
    var scopes = SCOPES.filter(function(c,i){ var el=document.getElementById('f-c'+i); return el&&el.checked; });
    var sources = [[g('f-s0l'),g('f-s0u')],[g('f-s1l'),g('f-s1u')]].filter(function(s){return s[1];}).map(function(s){return {label:s[0]||s[1].replace(/^https?:\/\/(www\.)?/,'').split('/')[0], url:s[1]};});
    return { id:e.id, date:g('f-date'), scopes:scopes, category:g('f-cat'), status:g('f-status'), title:g('f-title'), summary:g('f-summary'), value:g('f-value'), sources:sources, note:(document.getElementById('f-note')||{}).value||'' };
  }
  function todayISO(){ var d=new Date(); var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }

  function buildDoc(state){
    var json = JSON.stringify(state).replace(/</g,'\\u003c');
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-js').textContent;
    var fonts = document.getElementById('app-fonts').getAttribute('href');
    var S='scr'+'ipt';
    var reset=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
      '<title>NJ-06 Grid Cost Tracker</title>\n'+
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
      '<link id="app-fonts" rel="stylesheet" href="'+fonts.replace(/&/g,'&amp;')+'">\n'+
      '<style id="app-style">'+css+'</style>\n<div id="app"></div>\n'+
      '<'+S+' id="tracker-data" type="application/json">'+json+'</'+S+'>\n'+
      '<'+S+' id="app-js">'+js+'</'+S+'>\n</body></html>';
  }

  function save(next){
    if (!artifactNs){ ui.msg='Saving is not available in this view.'; render(); return; }
    ui.busy=true; ui.msg=''; render();
    artifactNs.publish(buildDoc(next)).then(function(){}, function(err){
      ui.busy=false;
      var code = err && err.code;
      if (code==='conflict'){ ui.msg='A newer version was just published. The page is reloading to it.'; }
      else if (code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='capability_disabled'||code==='consent_required'){ ui.canEdit=false; ui.editing=null; ui.confirmDel=null; ui.msg=''; }
      else if (code==='rate_limited'){ ui.msg='Too many saves in a row. Wait a minute and try again.'; }
      else { ui.msg='The save did not go through. Try again in a moment.'; }
      render();
    });
  }
  function nextState(entries){ return { updated: todayISO(), keyNumbers: STATE.keyNumbers||[], capacity: STATE.capacity||[], bills: STATE.bills||[], national: STATE.national||null, entries: entries }; }

  document.addEventListener('input', function(ev){ if (ev.target.id==='q'){ ui.q=ev.target.value; render(); } });
  document.addEventListener('change', function(ev){ if (ev.target.id==='cat'){ ui.category=ev.target.value; render(); } });
  document.addEventListener('submit', function(ev){
    if (ev.target.id!=='editor') return;
    ev.preventDefault();
    var e = readForm();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date)){ ui.editing=e; ui.msg='Add a date.'; render(); return; }
    if (!e.title){ ui.editing=e; ui.msg='Add a headline.'; render(); return; }
    if (!e.scopes.length){ ui.editing=e; ui.msg='Pick at least one level.'; render(); return; }
    save(nextState(STATE.entries.filter(function(x){return x.id!==e.id;}).concat([e])));
  });

  var tipEl = null;
  function showTip(node){
    if (!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; tipEl.setAttribute('role','tooltip'); document.body.appendChild(tipEl); }
    tipEl.textContent = node.getAttribute('data-tip'); tipEl.hidden=false;
    var b=node.getBoundingClientRect();
    var x=Math.min(b.left+b.width/2+8, window.innerWidth-tipEl.offsetWidth-12), y=b.top-tipEl.offsetHeight-8;
    if (y<8) y=b.bottom+8;
    tipEl.style.left=Math.max(8,x)+'px'; tipEl.style.top=y+'px';
  }
  function hideTip(){ if(tipEl) tipEl.hidden=true; }
  function tipTarget(t){ return t && t.closest ? t.closest('[data-tip]') : null; }
  document.addEventListener('mouseover', function(ev){ var r=tipTarget(ev.target); if(r) showTip(r); else hideTip(); });
  document.addEventListener('focusin', function(ev){ var r=tipTarget(ev.target); if(r) showTip(r); else hideTip(); });
  document.addEventListener('scroll', hideTip, {passive:true});

  function goTo(id){
    ui.scope=''; ui.category=''; ui.q=''; render();
    var el=document.getElementById(id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.borderColor='var(--accent)'; setTimeout(function(){el.style.borderColor='';},1600); }
    hideTip();
  }
  document.addEventListener('keydown', function(ev){
    if ((ev.key==='Enter'||ev.key===' ') && ev.target.getAttribute && ev.target.getAttribute('role')==='button' && ev.target.hasAttribute('data-goto')){ ev.preventDefault(); goTo(ev.target.getAttribute('data-goto')); }
  });
  document.addEventListener('click', function(ev){
    var g = ev.target.closest && ev.target.closest('[data-goto]');
    if (g && g.getAttribute('data-goto')){ goTo(g.getAttribute('data-goto')); return; }
    var t = ev.target.closest && ev.target.closest('button'); if (!t) return;
    if (t.classList.contains('lane')){ var c=t.getAttribute('data-scope'); ui.scope = ui.scope===c ? '' : c; render(); return; }
    if (t.id==='clear-scope'){ ui.scope=''; render(); return; }
    if (t.id==='add'){ ui.editing={ id:'d'+Date.now().toString(36), date:todayISO(), scopes:[], category:CATEGORIES[0], status:'Announced', title:'', summary:'', value:'', sources:[], note:'' }; ui.msg=''; render(); var f=document.getElementById('f-title'); if(f) f.focus(); return; }
    if (t.id==='cancel'){ ui.editing=null; ui.msg=''; render(); return; }
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act==='edit'){ var found=STATE.entries.filter(function(x){return x.id===id;})[0]; if(found){ ui.editing=JSON.parse(JSON.stringify(found)); ui.msg=''; render(); window.scrollTo({top:document.getElementById('editor').offsetTop-20,behavior:'smooth'}); } return; }
    if (act==='del'){ ui.confirmDel=id; render(); return; }
    if (act==='del-no'){ ui.confirmDel=null; render(); return; }
    if (act==='del-yes'){ save(nextState(STATE.entries.filter(function(x){return x.id!==id;}))); return; }
  });

  render();

  if (window.claude && typeof window.claude.use==='function'){
    Promise.all([window.claude.use('artifact'), window.claude.use('user')]).then(function(r){
      artifactNs = r[0]; var user = r[1];
      if (!artifactNs || !user) return;
      return user.canEdit().then(function(ok){ if (ok){ ui.canEdit=true; render(); } });
    }).catch(function(){});
  }
})();
</script>

</body></html>
